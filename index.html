<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>ศูนย์สนเทศและการเรียนรู้</title>
<style>
:root {
  --primary:#0f766e;
  --primary-dark:#115e59;
  --accent:#f59e0b;
  --bg:#f1f5f9;
  --surface:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
  --shadow:0 10px 30px rgba(15,23,42,.10);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Noto Sans Thai","Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text)}
body{overflow-x:hidden}
.topbar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;box-shadow:0 3px 16px rgba(15,23,42,.18)
}
.nav{
  max-width:1400px;margin:auto;padding:14px 22px;
  display:flex;align-items:center;gap:14px
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);
  display:grid;place-items:center;font-size:21px;flex:none
}
.brand-text{min-width:0}
.brand-title{font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:.78rem;opacity:.82;margin-top:2px}
.actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{
  border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);
  color:#fff;border-radius:10px;padding:9px 12px;cursor:pointer;
  font:inherit;transition:.2s
}
.btn:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
.btn.primary{background:#fff;color:var(--primary);border-color:#fff;font-weight:700}
.viewer-wrap{max-width:1400px;margin:auto;padding:18px 18px 40px}
.toolbar{
  position:sticky;top:70px;z-index:10;background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 5px 20px rgba(15,23,42,.06);padding:10px 12px;margin-bottom:16px
}
.toolbar-inner{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tool-btn{
  min-width:38px;height:38px;border:1px solid var(--border);background:#fff;
  color:var(--text);border-radius:9px;cursor:pointer;font-size:17px
}
.tool-btn:hover{border-color:#94a3b8;background:#f8fafc}
.zoom-label{min-width:62px;text-align:center;font-weight:700;color:var(--muted);font-size:.9rem}
.divider{width:1px;height:28px;background:var(--border);margin:0 3px}
.hint{margin-left:auto;color:var(--muted);font-size:.82rem}
.document{
  background:#cbd5e1;border-radius:16px;padding:20px;
  box-shadow:var(--shadow);overflow:auto;text-align:center
}
.page{
  display:inline-block;background:#fff;line-height:0;
  box-shadow:0 5px 20px rgba(15,23,42,.18);transform-origin:top center;
  transition:transform .18s ease
}
.page img{display:block;max-width:none;width:100%;height:auto}
.footer{text-align:center;color:var(--muted);font-size:.78rem;padding:18px 0}
@media(max-width:700px){
  .nav{padding:11px 12px}
  .brand-sub{display:none}
  .brand-title{font-size:.95rem}
  .actions .label{display:none}
  .viewer-wrap{padding:10px 8px 25px}
  .toolbar{top:64px;padding:8px}
  .hint{display:none}
  .document{padding:8px;border-radius:12px}
  .tool-btn{height:36px;min-width:36px}
}
@media print{
  .topbar,.toolbar,.footer{display:none!important}
  .viewer-wrap{padding:0}
  .document{background:#fff;box-shadow:none;padding:0}
  .page{box-shadow:none}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="nav">
    <div class="brand">
      <div class="logo" aria-hidden="true">📚</div>
      <div class="brand-text">
        <div class="brand-title">ศูนย์สนเทศและการเรียนรู้</div>
        <div class="brand-sub">Information and Learning Center</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" onclick="window.print()">🖨️ <span class="label">พิมพ์</span></button>
      <button class="btn primary" onclick="downloadImage()">⬇️ <span class="label">บันทึก</span></button>
    </div>
  </div>
</header>

<main class="viewer-wrap">
  <div class="toolbar" role="toolbar" aria-label="เครื่องมือดูเอกสาร">
    <div class="toolbar-inner">
      <button class="tool-btn" onclick="zoom(-.1)" title="ย่อ">−</button>
      <div class="zoom-label" id="zoomLabel">100%</div>
      <button class="tool-btn" onclick="zoom(.1)" title="ขยาย">+</button>
      <div class="divider"></div>
      <button class="tool-btn" onclick="fitWidth()" title="พอดีกับหน้าจอ">↔</button>
      <button class="tool-btn" onclick="fitScreen()" title="พอดีหน้าจอ">⛶</button>
      <button class="tool-btn" onclick="resetZoom()" title="ขนาดเดิม">↺</button>
      <div class="hint">ใช้ปุ่ม + / − หรือเลื่อนเมาส์เพื่อดูรายละเอียด</div>
    </div>
  </div>

  <section class="document" id="document">

</main>

<script>
const page = document.getElementById('page');
const doc = document.getElementById('document');
const img = document.getElementById('docImage');
const label = document.getElementById('zoomLabel');
let scale = 1;

function applyScale(){
  page.style.width = (scale * 100) + '%';
  label.textContent = Math.round(scale * 100) + '%';
}
function zoom(delta){
  scale = Math.min(3, Math.max(.35, +(scale + delta).toFixed(2)));
  applyScale();
}
function resetZoom(){
  scale = 1; applyScale();
}
function fitWidth(){
  const maxWidth = Math.max(320, doc.clientWidth - 16);
  const natural = img.naturalWidth || 1224;
  scale = Math.min(1, maxWidth / natural);
  // CSS width is based on original image width through a percentage of its intrinsic width.
  page.style.width = Math.max(320, Math.min(maxWidth, natural * scale)) + 'px';
  label.textContent = Math.round((parseFloat(page.style.width) / natural) * 100) + '%';
}
function fitScreen(){
  const maxWidth = Math.max(320, doc.clientWidth - 16);
  const naturalW = img.naturalWidth || 1224;
  const naturalH = img.naturalHeight || 1584;
  const maxH = Math.max(400, window.innerHeight - 180);
  const s = Math.min(maxWidth / naturalW, maxH / naturalH);
  scale = Math.min(1, s);
  page.style.width = Math.max(320, naturalW * scale) + 'px';
  label.textContent = Math.round(scale * 100) + '%';
}
function downloadImage(){
  const a = document.createElement('a');
  a.href = img.src;
  a.download = 'ศูนย์สนเทศและการเรียนรู้.png';
  a.click();
}
document.addEventListener('keydown', e => {
  if(e.key === '+' || e.key === '=') zoom(.1);
  if(e.key === '-') zoom(-.1);
  if(e.key === '0') resetZoom();
});
img.addEventListener('load', () => {
  if(window.innerWidth < 800) fitWidth(); else resetZoom();
});
window.addEventListener('resize', () => {
  if(window.innerWidth < 600) fitWidth();
});
</script>
